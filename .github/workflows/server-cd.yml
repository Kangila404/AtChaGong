name: Server CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/server-cd.yml'
  workflow_dispatch:

concurrency:
  group: server-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/atchagong-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x server/gradlew

      - name: Test
        run: cd server && ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/atchagong-prod
          chmod 600 ~/.ssh/atchagong-prod
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          SERVER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/atchagong-server:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/atchagong-prod "${EC2_USER}@${EC2_HOST}" \
            "cd '${APP_DIR}' && \
             git fetch origin main --prune && \
             git checkout --detach '${DEPLOY_SHA}' && \
             test \"\$(git rev-parse HEAD)\" = '${DEPLOY_SHA}' && \
             cd infra && \
             SERVER_IMAGE='${SERVER_IMAGE}' docker compose --env-file .env.prod -f docker-compose.prod.yml pull && \
             SERVER_IMAGE='${SERVER_IMAGE}' docker compose --env-file .env.prod -f docker-compose.prod.yml up -d && \
             chmod +x scripts/wait-for-server.sh && \
             ./scripts/wait-for-server.sh atchagong-server 30 && \
             docker image prune -f && \
             sudo chmod +x scripts/backup-mysql-to-s3.sh && \
             sudo cp systemd/atchagong-mysql-backup.service /etc/systemd/system/atchagong-mysql-backup.service && \
             sudo cp systemd/atchagong-mysql-backup.timer /etc/systemd/system/atchagong-mysql-backup.timer && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable --now atchagong-mysql-backup.timer"