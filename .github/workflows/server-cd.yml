name: Server CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/docker-compose.prod.yml'
      - 'infra/Caddyfile.example'
      - 'infra/prometheus/prometheus.prod.yml'
      - '.github/workflows/server-cd.yml'
  workflow_dispatch:

concurrency:
  group: server-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/atchagong-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x server/gradlew

      - name: Test
        run: cd server && ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Export image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/atchagong-prod
          chmod 600 ~/.ssh/atchagong-prod
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          SERVER_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          ssh -i ~/.ssh/atchagong-prod "${EC2_USER}@${EC2_HOST}" \
            "cd '${APP_DIR}' && \
             git fetch --prune && \
             git checkout main && \
             git pull --ff-only && \
             cd infra && \
             SERVER_IMAGE='${SERVER_IMAGE}' docker compose --env-file .env.prod -f docker-compose.prod.yml pull && \
             SERVER_IMAGE='${SERVER_IMAGE}' docker compose --env-file .env.prod -f docker-compose.prod.yml up -d && \
             docker image prune -f"
