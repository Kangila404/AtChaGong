global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'atchagong-server-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          env: local

  - job_name: 'atchagong-server-docker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['server:8080']
        labels:
          env: docker